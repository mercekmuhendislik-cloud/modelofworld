<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yönetim — Model of World</title>
  <meta name="robots" content="noindex,nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90' fill='%23d34f6e'>M</text></svg>">
  <style>
    .adm-user { border:1px solid var(--line); border-radius:12px; background:var(--surface); margin-bottom:10px; overflow:hidden; }
    .adm-top { display:flex; align-items:center; gap:12px; padding:12px 14px; flex-wrap:wrap; }
    .adm-thumb { width:52px; height:66px; border-radius:8px; object-fit:cover; border:1px solid var(--line); background:var(--bg-2); flex:none; }
    .adm-id { min-width:150px; }
    .adm-id strong { font-size:.98rem; display:block; }
    .adm-id small { color:var(--text-2); font-size:.72rem; }
    .adm-badge { font-size:.6rem; letter-spacing:.1em; text-transform:uppercase; padding:3px 9px; border-radius:999px; border:1px solid var(--line); color:var(--gold); white-space:nowrap; }
    .adm-badge.st-onaylandi { color:#20744c; border-color:#4da878; }
    .adm-badge.st-reddedildi { color:#a33; border-color:#d95a5a; }
    .adm-actions { margin-left:auto; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .adm-actions .btn { padding:7px 13px; font-size:.62rem; }
    .adm-body { display:none; border-top:1px solid var(--line); padding:14px; font-size:.85rem; color:var(--text-2); line-height:1.9; }
    .adm-user.open .adm-body { display:block; }
    .adm-photos { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0; }
    .adm-photos img { width:74px; height:98px; object-fit:cover; border-radius:8px; border:1px solid var(--line); }
    .adm-photos img.arsiv { opacity:.35; filter:grayscale(.6); }
    .adm-sub { font-size:.82rem; border-bottom:1px solid var(--line); padding:9px 0; color:var(--text-2); word-break:break-word; }
    .adm-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px; }
    .adm-input { padding:8px 11px; border-radius:8px; background:var(--bg-2); border:1px solid var(--line); color:var(--text); font:inherit; font-size:.84rem; }
    .adm-stars { color:var(--gold); letter-spacing:1px; font-size:.85rem; }
    .adm-log { font-size:.76rem; color:var(--text-2); padding:5px 0; border-bottom:1px solid var(--line); }
    .adm-section-title { font-size:1.25rem; margin:34px 0 12px; font-family:var(--font-serif); }
    .edit-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-top:10px; }
    .edit-grid label { display:block; font-size:.62rem; text-transform:uppercase; letter-spacing:.12em; color:var(--text-2); margin-bottom:3px; }
    .edit-grid .adm-input, .edit-grid select { width:100%; }
    .edit-wrap { display:none; border-top:1px dashed var(--line); margin-top:10px; padding-top:10px; }
    .edit-wrap.open { display:block; }
    .mini { font-size:.76rem; color:var(--text-2); }
  </style>
</head>
<body data-page="admin">
  <section style="padding-top:40px">
    <div class="container" style="max-width:1020px">

      <!-- GİRİŞ EKRANI -->
      <div id="loginView" style="max-width:440px;margin:8vh auto 0">
        <div class="center" style="margin-bottom:22px">
          <span class="eyebrow" style="justify-content:center">Model of World</span>
          <h1 style="font-size:1.8rem">Yönetici Girişi</h1>
        </div>
        <div class="form-card">
          <form id="adminLoginForm" class="form-grid" style="grid-template-columns:1fr">
            <div class="field">
              <label>Yönetici Şifresi</label>
              <input type="password" id="adminPass" required placeholder="••••••••••••" autocomplete="current-password">
            </div>
            <button class="btn btn-gold full" type="submit">Giriş Yap</button>
            <span class="muted center" id="loginErr" style="font-size:.85rem"></span>
          </form>
        </div>
        <p class="muted center mt-2" style="font-size:.78rem">Oturum 12 saat geçerlidir. Şifrenizi panel içinden değiştirebilirsiniz.</p>
      </div>

      <!-- PANEL -->
      <div id="panelView" hidden>
        <div style="display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:12px;margin-bottom:18px">
          <div>
            <span class="eyebrow">Yönetim Paneli</span>
            <h1 style="font-size:1.9rem">Üyeler, Onaylar &amp; İşler</h1>
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-ghost btn-sm" id="pwBtn">🔑 Şifre Değiştir</button>
            <button class="btn btn-ghost btn-sm" id="admLogout">Çıkış</button>
          </div>
        </div>

        <div class="form-card" id="pwCard" hidden style="margin-bottom:18px;max-width:520px">
          <div class="form-grid" style="grid-template-columns:1fr 1fr">
            <div class="field"><label>Mevcut Şifre</label><input type="password" id="pwOld"></div>
            <div class="field"><label>Yeni Şifre (min. 8)</label><input type="password" id="pwNew"></div>
            <div class="full"><button class="btn btn-gold btn-sm" id="pwSave">Şifreyi Güncelle</button> <span class="muted" id="pwMsg" style="font-size:.82rem"></span></div>
          </div>
        </div>

        <div class="adm-row" style="margin-bottom:14px">
          <input class="adm-input" id="fText" placeholder="İsim / etiket / şehir ara…" style="flex:1;min-width:200px">
          <select class="adm-input" id="fStatus">
            <option value="">Tüm durumlar</option>
            <option value="inceleniyor">⏳ Onay bekleyenler</option>
            <option value="onaylandi">✓ Onaylılar</option>
            <option value="reddedildi">✕ Reddedilenler</option>
          </select>
          <span class="mini" id="countInfo"></span>
        </div>

        <div id="results"></div>

        <h2 class="adm-section-title">📋 İş Teklifi Oluştur</h2>
        <div class="form-card">
          <div class="form-grid">
            <div class="field"><label>İş Başlığı *</label><input type="text" id="jTitle" placeholder="örn. Teknoloji Fuarı Standı"></div>
            <div class="field"><label>Tarih</label><input type="date" id="jDate"></div>
            <div class="field"><label>Lokasyon</label><input type="text" id="jLoc" placeholder="İstanbul — TÜYAP"></div>
            <div class="field"><label>Çalışma Saatleri</label><input type="text" id="jHours" placeholder="09:00 – 18:00"></div>
            <div class="field"><label>Kaşe / Ücret</label><input type="text" id="jFee" placeholder="örn. 5.000 TL/gün"></div>
            <div class="field full"><label>Not</label><input type="text" id="jNote" placeholder="Kıyafet, ulaşım vb."></div>
            <div class="field full"><label>Teklif Gönderilecek Üyeler</label><div id="jMembers" class="adm-row"></div></div>
            <div class="full"><button class="btn btn-gold btn-sm" id="jSend">Teklifi Gönder</button> <span class="muted" id="jMsg" style="font-size:.84rem"></span></div>
          </div>
        </div>
        <div id="jobsList" class="mt-2"></div>

        <h2 class="adm-section-title" id="subTitle" hidden>✉️ Form Gönderimleri</h2>
        <div id="subs"></div>

        <h2 class="adm-section-title" id="logTitle" hidden>🕘 Aktivite Günlüğü</h2>
        <div id="logs"></div>
      </div>

    </div>
  </section>

  <script>
    const $ = id => document.getElementById(id);
    let DATA = null;
    const RED_SABLON = [
      "Fotoğraflarınız düşük çözünürlüklü — lütfen daha net fotoğraflar yükleyin.",
      "Makyajsız/doğal polaroid fotoğraf eklemeniz gerekiyor.",
      "Tüm boy fotoğrafı eksik — lütfen boy fotoğrafı ekleyin.",
      "Ölçü bilgileriniz eksik — lütfen ölçü kartınızı tamamlayın.",
      "Şu an kadromuz için uygun profil bulunmuyor; ileride tekrar değerlendirilecektir.",
    ];
    const CATS = { model:"Model", hostes:"Hostes", yuz:"Yüz Modeli", cocuk:"Çocuk", oyuncu:"Oyuncu" };

    async function api(path, payload) {
      const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload || {}) }).catch(() => null);
      const d = r ? await r.json().catch(() => ({})) : {};
      return { ok: !!(r && r.ok), err: d.error };
    }

    /* ---------- Giriş ---------- */
    $("adminLoginForm").addEventListener("submit", async e => {
      e.preventDefault();
      $("loginErr").textContent = "Kontrol ediliyor…";
      const res = await api("/api/admin/login", { password: $("adminPass").value });
      if (!res.ok) { $("loginErr").textContent = res.err || "Şifre hatalı."; return; }
      $("loginErr").textContent = "";
      load();
    });
    $("admLogout").addEventListener("click", async () => { await api("/api/admin/logout"); location.reload(); });
    $("pwBtn").addEventListener("click", () => $("pwCard").hidden = !$("pwCard").hidden);
    $("pwSave").addEventListener("click", async () => {
      const res = await api("/api/admin/password", { old: $("pwOld").value, new: $("pwNew").value });
      $("pwMsg").textContent = res.ok ? "✓ Şifre değişti" : (res.err || "Hata");
      if (res.ok) { $("pwOld").value = $("pwNew").value = ""; }
    });

    $("fText") && $("fText").addEventListener("input", renderUsers);
    $("fStatus").addEventListener("change", renderUsers);

    async function load() {
      const r = await fetch("/api/admin/list").catch(() => null);
      if (!r || !r.ok) { $("loginView").hidden = false; $("panelView").hidden = true; return; }
      DATA = await r.json();
      $("loginView").hidden = true; $("panelView").hidden = false;
      renderUsers(); renderJobForm(); renderJobs(); renderSubs(); renderLogs();
    }
    load(); /* oturum varsa direkt panel açılır */

    /* ---------- Üye kartları (sıkı + düzenlenebilir) ---------- */
    function esc(v) { return String(v == null ? "" : v).replace(/"/g, "&quot;").replace(/</g, "&lt;"); }

    function renderUsers() {
      const q = ($("fText").value || "").toLowerCase();
      const stF = $("fStatus").value;
      const users = DATA.users.filter(u => {
        const p = u.profile || {};
        if (stF && (p.status || "inceleniyor") !== stF) return false;
        if (q && !`${u.fullname} ${u.email} ${p.city} ${p.category} ${p.admin_tags}`.toLowerCase().includes(q)) return false;
        return true;
      });
      $("countInfo").textContent = users.length + " üye";

      $("results").innerHTML = users.length ? users.map(u => {
        const p = u.profile || {};
        const st = p.status || "inceleniyor";
        const aktif = (u.media || []).filter(m => !m.deleted);
        const arsiv = (u.media || []).filter(m => m.deleted);
        const fotolar = aktif.filter(m => m.kind === "photo");
        const thumb = fotolar[0] ? `<img class="adm-thumb" src="/api/photo/${fotolar[0].id}" loading="lazy">` : `<div class="adm-thumb"></div>`;
        const videolar = aktif.filter(m => m.kind === "video");
        const belgeler = aktif.filter(m => m.kind === "belge");
        const imzalar = aktif.filter(m => m.kind === "imza");
        const stars = p.admin_rating ? "★".repeat(+p.admin_rating) : "";
        const olcu = [p.height && p.height+"cm", p.weight && p.weight+"kg", p.bust && "G"+p.bust, p.waist && "B"+p.waist,
          p.hip && "K"+p.hip, p.shoe && "Ayk"+p.shoe, p.size && p.size, p.hair, p.eye, p.skin].filter(Boolean).join(" · ");

        return `
        <div class="adm-user" data-uid="${u.id}">
          <div class="adm-top" data-toggle>
            ${thumb}
            <div class="adm-id">
              <strong>${esc(u.fullname) || "(isimsiz)"} <span class="adm-stars">${stars}</span></strong>
              <small>#${u.id} · ${esc(p.city) || "?"} · ${CATS[p.category] || "?"} · ${u.created?.slice(0,10) || ""}</small>
            </div>
            <span class="adm-badge st-${st}">${st === "onaylandi" ? "✓ onaylı" : st === "reddedildi" ? "✕ red" : "⏳ bekliyor"}</span>
            ${p.privacy === "public" ? '<span class="adm-badge">🌍</span>' : '<span class="adm-badge">🔒</span>'}
            ${p.admin_tags ? `<span class="adm-badge">🏷 ${esc(p.admin_tags)}</span>` : ""}
            <div class="adm-actions">
              <button class="btn btn-gold" data-act="onaylandi">✓ Onayla</button>
              <button class="btn btn-ghost" data-act="reddet-menu">✕ Reddet</button>
              <button class="btn btn-ghost" data-act="edit">✏️ Düzenle</button>
              <a class="btn btn-ghost" href="sedcard.html?id=${u.id}" target="_blank">🪪 Sedcard</a>
            </div>
          </div>
          <div class="adm-body">
            📧 ${esc(u.email)} · 📞 ${esc(u.phone) || "—"} · 🎂 ${p.birthdate || "—"} ${p.gender || ""}<br>
            📏 ${olcu || "ölçü yok"}<br>
            🗣 ${esc(p.languages) || "—"} · 📸 ${esc(p.instagram) || "—"} · 🎬 ${p.video_link ? `<a class="gold" href="${esc(p.video_link)}" target="_blank">video linki</a>` : "—"}
            ${p.about ? "<br>💬 " + esc(p.about) : ""}
            ${p.review_note ? `<br>📮 Üyeye iletilen not: "${esc(p.review_note)}"` : ""}
            <div class="adm-photos">
              ${fotolar.map(m => `<a href="/api/photo/${m.id}" target="_blank" title="${m.album}"><img src="/api/photo/${m.id}" loading="lazy"></a>`).join("")}
              ${videolar.map(m => `<a class="btn btn-ghost btn-sm" href="/api/photo/${m.id}" target="_blank">🎬 ${esc(m.orig)}</a>`).join("")}
            </div>
            <div class="adm-row">
              <select class="adm-input" data-redsel style="max-width:300px">
                <option value="">Red gerekçesi…</option>
                ${RED_SABLON.map(s => `<option>${s}</option>`).join("")}
                <option value="__ozel">✏️ Özel gerekçe…</option>
              </select>
              <button class="btn btn-ghost btn-sm" data-act="reddedildi">Gerekçeyle Reddet</button>
              <button class="btn btn-ghost btn-sm" data-act="inceleniyor">↺ Beklet</button>
              <span class="muted" data-msg style="font-size:.8rem"></span>
            </div>
            <div class="adm-row">
              <input class="adm-input" data-note placeholder="İç not (üye görmez)" value="${esc(p.admin_note)}" style="flex:1;min-width:200px">
              <select class="adm-input" data-rating>
                <option value="">Puan</option>
                ${[1,2,3,4,5].map(n => `<option value="${n}" ${p.admin_rating == n ? "selected" : ""}>${"★".repeat(n)}</option>`).join("")}
              </select>
              <input class="adm-input" data-tags placeholder="Etiketler: Dövmeli, Kısa Saçlı…" value="${esc(p.admin_tags)}" style="min-width:170px">
              <button class="btn btn-gold btn-sm" data-act="not">Notu Kaydet</button>
            </div>
            <div class="mini" style="margin-top:8px">
              💳 ${p.iban || "IBAN yok"} (${esc(p.account_name) || "?"} · ${esc(p.bank_name) || "?"}) · 🧾 ${p.invoice_type || "—"}
              · 👨‍👩‍👧 ${esc(p.parent_name) || "veli yok"} ${p.parent_tc ? "TC:" + p.parent_tc : ""} ${esc(p.parent_phone) || ""}
              · 📄 ${belgeler.map(m => `<a class="gold" href="/api/photo/${m.id}" target="_blank">${esc(m.orig)}</a>`).join(", ") || "belge yok"}
              · ✍️ ${imzalar.length ? `<a class="gold" href="/api/photo/${imzalar[imzalar.length-1].id}" target="_blank">imza</a>` : "imza yok"}
            </div>
            ${arsiv.length ? `<div class="mini" style="margin-top:6px">🗄 Arşiv (${arsiv.length}):</div><div class="adm-photos">${
              arsiv.map(m => m.kind === "photo"
                ? `<a href="/api/photo/${m.id}" target="_blank"><img class="arsiv" src="/api/photo/${m.id}" loading="lazy" title="${m.created?.slice(0,10)}"></a>`
                : `<a class="gold mini" href="/api/photo/${m.id}" target="_blank">${m.kind}: ${esc(m.orig)}</a>`).join("")}</div>` : ""}

            <!-- DÜZENLEME FORMU -->
            <div class="edit-wrap" data-editwrap>
              <strong class="mini" style="color:var(--gold)">✏️ Üye bilgilerini düzenle (yanlış girilenleri düzeltebilirsiniz)</strong>
              <div class="edit-grid">
                <div><label>Ad Soyad</label><input class="adm-input" data-e="fullname" value="${esc(u.fullname)}"></div>
                <div><label>Telefon</label><input class="adm-input" data-e="phone" value="${esc(u.phone)}"></div>
                <div><label>Şehir</label><input class="adm-input" data-e="city" value="${esc(p.city)}"></div>
                <div><label>Doğum</label><input class="adm-input" type="date" data-e="birthdate" value="${esc(p.birthdate)}"></div>
                <div><label>Kategori</label><select class="adm-input" data-e="category">${["","model","hostes","yuz","cocuk","oyuncu"].map(c => `<option value="${c}" ${p.category === c ? "selected" : ""}>${CATS[c] || "—"}</option>`).join("")}</select></div>
                <div><label>Cinsiyet</label><select class="adm-input" data-e="gender"><option value="">—</option><option value="kadin" ${p.gender === "kadin" ? "selected" : ""}>Kadın</option><option value="erkek" ${p.gender === "erkek" ? "selected" : ""}>Erkek</option></select></div>
                <div><label>Boy</label><input class="adm-input" data-e="height" value="${esc(p.height)}"></div>
                <div><label>Kilo</label><input class="adm-input" data-e="weight" value="${esc(p.weight)}"></div>
                <div><label>Göğüs</label><input class="adm-input" data-e="bust" value="${esc(p.bust)}"></div>
                <div><label>Bel</label><input class="adm-input" data-e="waist" value="${esc(p.waist)}"></div>
                <div><label>Basen</label><input class="adm-input" data-e="hip" value="${esc(p.hip)}"></div>
                <div><label>Ayakkabı</label><input class="adm-input" data-e="shoe" value="${esc(p.shoe)}"></div>
                <div><label>Beden</label><input class="adm-input" data-e="size" value="${esc(p.size)}"></div>
                <div><label>Saç</label><input class="adm-input" data-e="hair" value="${esc(p.hair)}"></div>
                <div><label>Göz</label><input class="adm-input" data-e="eye" value="${esc(p.eye)}"></div>
                <div><label>Ten</label><input class="adm-input" data-e="skin" value="${esc(p.skin)}"></div>
                <div><label>Diller</label><input class="adm-input" data-e="languages" value="${esc(p.languages)}"></div>
                <div><label>Instagram</label><input class="adm-input" data-e="instagram" value="${esc(p.instagram)}"></div>
              </div>
              <div class="adm-row">
                <button class="btn btn-gold btn-sm" data-act="kaydet-edit">💾 Değişiklikleri Kaydet</button>
                <span class="muted" data-editmsg style="font-size:.8rem"></span>
              </div>
            </div>
          </div>
        </div>`;
      }).join("") : '<p class="muted mt-2">Filtreye uyan üye yok.</p>';
    }

    $("results").addEventListener("click", async e => {
      const card = e.target.closest(".adm-user");
      if (!card) return;
      const uid = +card.dataset.uid;
      const msg = card.querySelector("[data-msg]");
      const b = e.target.closest("[data-act]");

      /* kart aç/kapa (butonlara tıklamadıysa) */
      if (!b && e.target.closest("[data-toggle]") && !e.target.closest("a,button,select,input")) {
        card.classList.toggle("open"); return;
      }
      if (!b) return;
      const act = b.dataset.act;

      if (act === "edit") { card.classList.add("open"); card.querySelector("[data-editwrap]").classList.toggle("open"); return; }
      if (act === "reddet-menu") { card.classList.add("open"); card.querySelector("[data-redsel]").focus(); return; }

      if (act === "kaydet-edit") {
        const payload = { user_id: uid };
        card.querySelectorAll("[data-e]").forEach(i => payload[i.dataset.e] = i.value);
        const res = await api("/api/admin/update", payload);
        card.querySelector("[data-editmsg]").textContent = res.ok ? "✓ Kaydedildi" : (res.err || "Hata");
        if (res.ok) load();
        return;
      }
      if (act === "not") {
        const res = await api("/api/admin/note", {
          user_id: uid,
          admin_note: card.querySelector("[data-note]").value,
          admin_rating: card.querySelector("[data-rating]").value,
          admin_tags: card.querySelector("[data-tags]").value,
        });
        msg.textContent = res.ok ? "✓" : "Hata";
        if (res.ok) load();
        return;
      }
      let note = "";
      if (act === "reddedildi") {
        note = card.querySelector("[data-redsel]").value;
        if (note === "__ozel") note = prompt("Üyeye iletilecek gerekçe:") || "";
        if (!note) { card.classList.add("open"); msg.textContent = "Önce gerekçe seçin."; return; }
      }
      if (act === "onaylandi") note = "Tebrikler! Model of World ailesine katıldınız — profiliniz kadroya alındı.";
      const res = await api("/api/admin/review", { user_id: uid, status: act, review_note: note });
      msg.textContent = res.ok ? "✓" : "Hata";
      if (res.ok) load();
    });

    /* ---------- İşler / gönderimler / günlük ---------- */
    function renderJobForm() {
      $("jMembers").innerHTML = DATA.users.map(u => `
        <label style="display:inline-flex;gap:6px;align-items:center;font-size:.82rem;border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer">
          <input type="checkbox" value="${u.id}" class="jm"> ${esc(u.fullname) || esc(u.email)}
        </label>`).join("");
    }
    $("jSend").addEventListener("click", async () => {
      const ids = [...document.querySelectorAll(".jm:checked")].map(c => +c.value);
      const res = await api("/api/admin/job", {
        title: $("jTitle").value, date: $("jDate").value, location: $("jLoc").value,
        hours: $("jHours").value, fee: $("jFee").value, note: $("jNote").value, user_ids: ids,
      });
      $("jMsg").textContent = res.ok ? "✓ Teklif üyelerin paneline düştü" : (res.err || "Başlık ve en az bir üye gerekli");
      if (res.ok) { ["jTitle","jDate","jLoc","jHours","jFee","jNote"].forEach(i => $(i).value = ""); load(); }
    });
    function renderJobs() {
      $("jobsList").innerHTML = (DATA.jobs || []).map(j => `
        <div class="adm-user open"><div class="adm-body" style="display:block">
          <strong style="color:var(--text)">${esc(j.title)}</strong> <span class="mini">${j.date || ""} · ${esc(j.location) || ""} · ${esc(j.hours) || ""} · ${esc(j.fee) || ""}</span><br>
          Yanıtlar: ${j.offers.map(o => `${esc(o.fullname)}: <strong>${o.status === "kabul" ? "✓ kabul" : o.status === "red" ? "✕ red" : "⏳"}</strong>`).join(" · ") || "—"}
        </div></div>`).join("");
    }
    function renderSubs() {
      $("subTitle").hidden = !DATA.submissions.length;
      $("subs").innerHTML = DATA.submissions.map(s =>
        `<div class="adm-sub"><strong>[${s.kind}]</strong> ${s.created?.slice(0,16).replace("T"," ")} — ${esc(s.data)}</div>`).join("");
    }
    function renderLogs() {
      $("logTitle").hidden = !(DATA.audit || []).length;
      $("logs").innerHTML = (DATA.audit || []).map(l =>
        `<div class="adm-log">${l.created?.slice(0,16).replace("T"," ")} · <strong>${l.who}</strong> → ${l.action}${l.user_id ? " (üye #" + l.user_id + ")" : ""}${l.detail ? " — " + esc(l.detail) : ""}</div>`).join("");
    }
  </script>
</body>
</html>
