<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Özel Cast Sunumu — Model of World</title>
  <meta name="robots" content="noindex,nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90' fill='%23d34f6e'>M</text></svg>">
  <style>
    .vip-head { text-align:center; padding: 40px 0 8px; }
    .vip-member { max-width: 900px; margin: 0 auto 34px; background: var(--surface); border: 1px solid var(--line);
      border-radius: 16px; padding: clamp(18px, 3vw, 32px); }
    .vip-member h2 { font-size: 1.6rem; }
    .vip-cat { color: var(--gold); font-size: .7rem; letter-spacing: .3em; text-transform: uppercase; }
    .vip-photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin: 16px 0; }
    .vip-photos .vp { aspect-ratio: 3/4; border-radius: 10px; overflow: hidden; position: relative; }
    .vip-photos img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; user-select: none; }
    .vp::after { content: "MODEL OF WORLD"; position: absolute; right: 10px; bottom: 8px;
      font-family: var(--font-serif); font-size: .62rem; letter-spacing: .24em;
      color: rgba(255,255,255,.85); text-shadow: 0 1px 8px rgba(0,0,0,.65); pointer-events: none; }
    .vip-expire { text-align: center; font-size: .8rem; color: var(--text-2); padding-bottom: 40px; }
  </style>
</head>
<body data-page="paylasim">
  <div class="vip-head">
    <span class="eyebrow" style="justify-content:center">Model of World — Özel Sunum</span>
    <h1 style="font-size:clamp(1.6rem,4vw,2.4rem)">Size Özel Cast Seçkisi</h1>
    <p class="muted" style="max-width:56ch;margin:10px auto 24px;font-size:.9rem">Bu sayfa yalnızca sizinle paylaşılmıştır ve belirtilen sürenin sonunda otomatik olarak kapanır. İçeriğin üçüncü kişilerle paylaşılmaması rica olunur.</p>
  </div>
  <div class="container" id="root"><p class="muted center">Yükleniyor…</p></div>
  <div class="vip-expire" id="expInfo"></div>

  <script>
    document.addEventListener("contextmenu", e => e.preventDefault());
    (async function () {
      const t = new URLSearchParams(location.search).get("t") || "";
      const r = await fetch("/api/share/" + encodeURIComponent(t)).catch(() => null);
      const root = document.getElementById("root");
      if (!r || !r.ok) {
        root.innerHTML = '<div class="empty-state"><div class="serif">Bu bağlantının süresi dolmuş</div><p>Yeni bir sunum bağlantısı için lütfen ajansımızla iletişime geçin: info@modelofworld.com</p></div>';
        return;
      }
      const d = await r.json();
      const CATS = { model: "Manken / Model", hostes: "Fuar & Kongre Hostesi", yuz: "Yüz Modeli", cocuk: "Çocuk Model", oyuncu: "Oyuncu / Cast" };
      root.innerHTML = d.members.map(m => {
        const p = m.profile || {};
        const rows = [["Boy", p.height && p.height + " cm"], ["Kilo", p.weight && p.weight + " kg"],
          ["Göğüs", p.bust], ["Bel", p.waist], ["Basen", p.hip], ["Ayakkabı", p.shoe], ["Beden", p.size],
          ["Saç", p.hair], ["Göz", p.eye], ["Ten", p.skin], ["Şehir", p.city], ["Diller", p.languages]]
          .filter(x => x[1]);
        return `
        <div class="vip-member">
          <span class="vip-cat">${CATS[p.category] || ""}</span>
          <h2>${m.name}</h2>
          <div class="vip-photos">
            ${m.photos.map(id => `<div class="vp"><img src="/api/share-photo/${encodeURIComponent(t)}/${id}" loading="lazy" draggable="false"></div>`).join("") || '<p class="muted">Fotoğraf yok</p>'}
          </div>
          <dl class="sedcard">${rows.map(([a, b]) => `<div><dt>${a}</dt><dd style="font-size:1.05rem">${b}</dd></div>`).join("")}</dl>
          <div class="mt-2"><a class="btn btn-gold btn-sm" href="mailto:info@modelofworld.com?subject=Cast talebi: ${encodeURIComponent(m.name)}">Bu Profil İçin Teklif İsteyin</a></div>
        </div>`;
      }).join("");
      const exp = new Date(d.expires);
      document.getElementById("expInfo").textContent = "Bu sunum " + exp.toLocaleString("tr-TR") + " tarihine kadar geçerlidir · www.modelofworld.com";
    })();
  </script>
</body>
</html>
