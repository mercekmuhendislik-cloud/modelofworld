    <text x="266" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="27"
          letter-spacing="4.5" fill="#1a1216">WORLD</text>
    <text x="101" y="80" font-family="Georgia, 'Times New Roman', serif" font-size="10"
          letter-spacing="6" fill="#96707c">AGENCY</text>
