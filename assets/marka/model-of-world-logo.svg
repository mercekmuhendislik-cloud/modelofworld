<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 408 120" width="408" height="120" role="img" aria-label="Model of World">
  <title>Model of World — ana logo</title>
  <g fill="#d34f6e">
    <!-- Amblem: MW madalyonu -->
    <circle cx="52" cy="62" r="30" fill="none" stroke="#d34f6e" stroke-width="2.2"/>
    <path d="M52 16.5 L54 21.5 L59 23.5 L54 25.5 L52 30.5 L50 25.5 L45 23.5 L50 21.5 Z"/>
    <text x="52" y="72" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
