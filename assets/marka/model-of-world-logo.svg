    <!-- Kelime markası -->
    <text x="100" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="27"
          letter-spacing="4.5" fill="#1a1216">MODEL</text>
    <text x="230" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="24"
